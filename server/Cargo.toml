[package]
name = "maplayer-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MainListActivity/maplayerdev"
description = "Maplayer host daemon: manages local agent sessions (Codex, Cursor) and serves them over iroh."

[lib]
name = "maplayer_server"
path = "src/lib.rs"

[[bin]]
name = "maplayer-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
iroh = "1.2.0"
notify = "8.2.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
