name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  server:
    name: server (cargo workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: cargo test
        run: cargo test

  desktop:
    name: desktop (vite client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: typecheck
        working-directory: desktop
        run: npx tsc --noEmit
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      # externalBin in tauri.conf.json requires the staged server binary to
      # exist at build time; stage a debug build like release.yml does.
      - name: Stage maplayer-server sidecar
        run: |
          cargo build -p maplayer-server
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p desktop/src-tauri/binaries
          cp "target/debug/maplayer-server" "desktop/src-tauri/binaries/maplayer-server-${triple}"
      # cargo check so src-tauri compile errors surface on PRs, not at release.
      - name: cargo check (src-tauri)
        working-directory: desktop/src-tauri
        run: cargo check

  android:
    name: android (gradle wrapper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          yes | "$SDKMGR" --licenses >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      # Compile Kotlin on PRs so app code errors surface before release.
      - name: Kotlin compile check
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            ./gradlew compileReleaseKotlin
          else
            echo "no gradle wrapper committed; skipping check"
          fi
